[project]
name = "tradeflow"
version = "0.1.0"
description = "TradeFlow: money control room for MSME exporters"
readme = "README.md"
authors = [
    { name = "Perfect_7613", email = "amitjoshi2052003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sarvamai>=0.1.48",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
tradeflow = "tradeflow:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
