name: TradeFlowEars
options:
  bundleIdPrefix: app.tradeflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Q4NNF68GR8   # change to your own team ID
targets:
  TradeFlowEars:
    type: application
    platform: iOS
    sources: [TradeFlowEars]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ameymuke.tradeflow.ears
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TradeFlow
        INFOPLIST_KEY_NSMotionUsageDescription: TradeFlow reads your AirPods head movement so you can approve a payment with a nod.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: TradeFlow listens when you speak to change an amount or use live translation.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: TradeFlow connects to the TradeFlow server running on your laptop over Wi-Fi.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    info:
      path: TradeFlowEars/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # lets you point at http://<laptop-ip>:8000 on the same Wi-Fi
